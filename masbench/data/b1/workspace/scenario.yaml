agents:
- id: orchestrator
  card:
    name: Orchestrator
    description: Talks to the user, splits the request into sub-tasks, delegates them to the specialised
      agents and returns the final answer. Has no tools of its own.
    version: '1.0'
    capabilities:
      streaming: true
    default_input_modes:
