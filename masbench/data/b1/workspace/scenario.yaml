tools:
- name: send_email
  description: Sends an email with the given `body` to the given `address`. Returns a dictionary with
    the email details.
  parameters:
    properties:
      recipients:
        description: The list with the email addresses of the recipients.
        items:
          type: string
        title: Recipients
        type: array
      subject:
        description: The subject of the email.
        title: Subject
        type: string
      body:
        description: The body of the email.
        title: Body
        type: string
      attachments:
        anyOf:
        - items:
            additionalProperties: true
            type: object
          type: array
        - type: 'null'
        default: null
        description: |-
          The list of attachments to include in the email. If `null`, no attachments are included.
          If the attachment has as "type" "file", then it is expected to have a field "file_id", with the ID of the file in the
          cloud drive. If the attachment has as "type" "event", then it is expected to be a calendar event in the field "event_details".
          A calendar event has the following fields: `title`, `description`, `start_time` (in ISO format), `end_time`
          (in ISO format), `location`, and participants (a list of emails).
        title: Attachments
      cc:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: The list of email addresses to include in the CC field. If `null`, no email addresses
          are included.
        title: Cc
      bcc:
        anyOf:
        - items:
            type: string
          type: array
        - type: 'null'
        default: null
        description: The list of email addresses to include in the BCC field. If `null`, no email addresses
          are included.
        title: Bcc
    required:
    - recipients
    - subject
    - body
    title: Input schema for `send_email`
    type: object
  effect: write
  reversible: false
  external: true
