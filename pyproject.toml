[project]
name = "kairos"
version = "0.1.0"
description = "a transactional reference monitor for black-box LLM agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ada-url>=1.32.0",
    "agentdojo",
    "anthropic>=0.105.2",
    "cohere>=7.0.3",
    "openai>=2.40.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
eval  = ["agentdojo"]        # Phase 1 — simulation adapter
llm   = ["openai>=1.0"]      # Phase 2 — judge
fuzzy = ["rapidfuzz>=3.0"]   # Phase 1 — fuzzy matching strategy

[dependency-groups]                       # PEP 735 — installed by default by uv
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "types-PyYAML"]

[project.scripts]
kairos = "kairos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairos"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100

[tool.uv.workspace]
members = [
    "benchmark/agentdojo",
]

[tool.uv.sources]
agentdojo = { workspace = true, editable = true }
