<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAIROS MAS Run Viewer</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #677085; --line: #d9dde5;
  --cluster: #eef2f8; --cluster-line: #b9c3d6; --agent: #ffffff;
  --blue: #2f6fdf; --purple: #8a4fd0; --green: #1f9d55; --amber: #d98a00; --red: #d93a3a;
  --oracle: #6b3fb8; --ext: #f3efe6; --hl: #ffe08a; --sel: #e6eefc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --panel: #1c2028; --ink: #e5e8ef; --muted: #98a1b3; --line: #2e3442;
    --cluster: #1f2633; --cluster-line: #3b4760; --agent: #252b36;
    --ext: #2a2620; --hl: #6b5512; --sel: #24314a;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --panel: #1c2028; --ink: #e5e8ef; --muted: #98a1b3; --line: #2e3442;
  --cluster: #1f2633; --cluster-line: #3b4760; --agent: #252b36;
  --ext: #2a2620; --hl: #6b5512; --sel: #24314a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display: grid; height: 100vh; grid-template-rows: auto 1fr;
  grid-template-columns: var(--browser-w, 0px) 1fr 440px; }
header { grid-column: 1 / -1; grid-row: 1; display: flex; align-items: center; gap: 12px; padding: 8px 14px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
  border: 1px solid var(--line); white-space: nowrap; }
.b-ok { color: var(--green); border-color: var(--green); }
.b-bad { color: var(--red); border-color: var(--red); }
.b-warn { color: var(--amber); border-color: var(--amber); }
#runinfo { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--muted); flex: 1; min-width: 0; }
#browser { grid-column: 1; grid-row: 2; border-right: 1px solid var(--line); background: var(--panel); overflow: auto; display: none; }
#browser.on { display: block; }
#browser input { width: calc(100% - 16px); margin: 8px; padding: 5px 7px; border: 1px solid var(--line);
  border-radius: 6px; background: var(--bg); color: var(--ink); }
.run-group { padding: 6px 10px 2px; font-size: 11px; color: var(--muted); word-break: break-all; }
.run-item { padding: 4px 10px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.run-item:hover { background: var(--sel); }
.run-item.cur { background: var(--sel); font-weight: 600; }
main { grid-column: 2; grid-row: 2; display: grid; grid-template-rows: 1fr auto; min-width: 0; min-height: 0; }
#stagewrap { position: relative; min-height: 0; overflow: hidden; }
svg#stage { width: 100%; height: 100%; display: block; }
#controls { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line);
  background: var(--panel); flex-wrap: wrap; }
button { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 9px; cursor: pointer; font-size: 13px; }
button:hover { border-color: var(--blue); }
button.primary { background: var(--blue); color: #fff; border-color: var(--blue); min-width: 70px; }
select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
#scrub { flex: 1; min-width: 160px; }
#counter { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 120px; text-align: right; }
aside { grid-column: 3; grid-row: 2; border-left: 1px solid var(--line); background: var(--panel); display: grid;
  grid-template-rows: auto minmax(120px, 45%) 1fr; min-height: 0; }
#filters { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
#filters label { display: flex; gap: 3px; align-items: center; cursor: pointer; }
#events { overflow: auto; border-bottom: 1px solid var(--line); }
.ev { display: grid; grid-template-columns: 52px 18px 1fr; gap: 4px; padding: 2px 8px; cursor: pointer;
  border-left: 3px solid transparent; }
.ev:hover { background: var(--sel); }
.ev.cur { background: var(--sel); border-left-color: var(--blue); }
.ev.future { opacity: .45; }
.ev .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11px; padding-top: 1px; }
.ev .s { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#detail { overflow: auto; padding: 10px 12px; }
#detail h3 { margin: 0 0 6px; font-size: 14px; }
#detail .kv { display: grid; grid-template-columns: 110px 1fr; gap: 2px 8px; margin-bottom: 8px; }
#detail .kv div:nth-child(odd) { color: var(--muted); }
#detail pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px; margin: 4px 0 10px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
  max-height: 420px; overflow: auto; }
#detail .lbl { font-weight: 600; margin-top: 6px; }
mark { background: var(--hl); color: inherit; border-radius: 2px; }
.link { color: var(--blue); cursor: pointer; text-decoration: underline; }
.muted { color: var(--muted); }
#drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(47,111,223,.12); border: 3px dashed var(--blue); font-size: 18px; }
#empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 8px; color: var(--muted); text-align: center; padding: 20px; }
svg text { fill: var(--ink); font-family: system-ui, sans-serif; }
.cl-box { fill: var(--cluster); stroke: var(--cluster-line); stroke-width: 1.5; }
.ag-box { fill: var(--agent); stroke: var(--cluster-line); stroke-width: 1.5; }
.ag-box.working { stroke: var(--blue); stroke-width: 3; }
.ag-box.flagged { stroke: var(--red); stroke-dasharray: 5 3; }
.small { font-size: 11px; fill: var(--muted); }
.bubble rect { fill: var(--panel); stroke: var(--blue); }
.bubble.notice rect { stroke: var(--amber); }
.bubble text { font-size: 11px; }
@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 60vh 60vh; height: auto; }
  header { flex-wrap: wrap; padding: 8px 16px; }
  header h1 { font-size: 14px; }
  #events .ev { grid-template-columns: 44px 18px minmax(0, 1fr); }
  #browser { grid-column: 1; grid-row: 2; }
  main { grid-column: 1; grid-row: 3; }
  aside { grid-column: 1; grid-row: 4; border-left: 0; border-top: 1px solid var(--line); }
  #browser.on { max-height: 30vh; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>KAIROS MAS · run viewer</h1>
    <button id="btnBrowser" title="Runs" style="display:none">☰ Runs</button>
    <div id="runinfo"></div>
    <label class="muted" title="Open a result or trace JSON">
      <input type="file" id="file" accept=".json" style="display:none">
      <button onclick="document.getElementById('file').click()">Open file…</button>
    </label>
    <button id="btnTheme" title="Toggle theme">◐</button>
  </header>
  <nav id="browser"><input id="runfilter" placeholder="filter runs…"><div id="runlist"></div></nav>
  <main>
    <div id="stagewrap">
      <svg id="stage" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="empty">
        <div style="font-size:16px">No run loaded</div>
        <div>Open a MASDojo result (<code>…/user_task_X/injection_task_Y.json</code>) or drop it here.<br>
        Or start the viewer on a log directory: <code>python -m kairos.mas.viewer serve evaluation/logs</code></div>
      </div>
      <div id="drop">Drop a result JSON</div>
    </div>
    <div id="controls">
      <button id="btnReset" title="Reset (Home)">⏮</button>
      <button id="btnBack" title="Step back (←)">◀</button>
      <button id="btnPlay" class="primary" title="Play / pause (space)">▶ Play</button>
      <button id="btnFwd" title="Step forward (→)">▶|</button>
      <button id="btnEnd" title="Jump to end (End)">⏭</button>
      <select id="speed" title="Speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option>
      </select>
      <select id="timing" title="Timing">
        <option value="steps" selected>uniform steps</option>
        <option value="real">recorded timing</option>
      </select>
      <input type="range" id="scrub" min="0" max="0" value="0">
      <span id="counter">0 / 0</span>
    </div>
  </main>
  <aside>
    <div id="filters"></div>
    <div id="events"></div>
    <div id="detail"><span class="muted">Select an event, or press play.</span></div>
  </aside>
</div>

<script id="trace-data" type="application/json">null</script>
<script>
"use strict";
// ---------------------------------------------------------------- vocabulary
const CATS = {
  run:       {label: "run",        kinds: ["run.start", "run.end"]},
  reasoning: {label: "reasoning",  kinds: ["agent.llm", "agent.task", "agent.done", "agent.notice"]},
  tools:     {label: "tools",      kinds: ["tool.call", "tool.result", "inbound.external"]},
  messages:  {label: "messages",   kinds: ["msg.send", "msg.outcome", "msg.deliver", "msg.release", "msg.drop"]},
  monitor:   {label: "monitor",    kinds: ["gate", "resolution", "notice"]},
  oracle:    {label: "oracle",     kinds: ["oracle.request", "oracle.llm", "oracle.verdict"]},
};
const CAT_OF = {};
for (const [c, v] of Object.entries(CATS)) for (const k of v.kinds) CAT_OF[k] = c;
const ICON = {
  "run.start": "▶", "run.end": "■", "agent.task": "◆", "agent.done": "◇", "agent.llm": "💭",
  "agent.notice": "⚑", "tool.call": "⚙", "tool.result": "↩", "inbound.external": "⇣",
  "msg.send": "✉", "msg.outcome": "⚖", "msg.deliver": "📥", "msg.release": "⇢", "msg.drop": "✗",
  "gate": "🛡", "resolution": "⚖", "notice": "⚑", "oracle.request": "?", "oracle.llm": "🧠", "oracle.verdict": "!",
};
const DEC_COLOR = {ALLOW: "var(--green)", REVIEW: "var(--amber)", DENY: "var(--red)"};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------------------------------------------------------------- state
let T = null;            // the trace
let L = null;            // layout
let S = null;            // replayed state
let idx = 0;             // number of events applied
let playing = false, timer = null, anims = [], selected = null;
const hidden = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const short = (s, n = 90) => { s = String(s ?? "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };

// ---------------------------------------------------------------- layout
function layout(trace) {
  const topo = trace.topology, W = 1000;
  const clusters = topo.clusters, n = clusters.length;
  const top = 110, bottom = 455, gap = 18, left = 20, right = 20;
  const cw = (W - left - right - gap * (n - 1)) / n;
  const out = {clusters: {}, agents: {}, W, H: 640};
  clusters.forEach((c, i) => {
    const x = left + i * (cw + gap);
    out.clusters[c.id] = {x, y: top, w: cw, h: bottom - top, dp: {x: x + cw - 30, y: top + 16}, c};
    const m = c.agents.length;
    const ah = Math.min(78, (bottom - top - 50 - 14 * (m - 1)) / Math.max(m, 1));
    const aw = Math.min(cw - 36, 230);
    c.agents.forEach((a, j) => {
      const ay = top + 44 + j * (ah + 14);
      const ax = x + (cw - aw) / 2;
      out.agents[a] = {x: ax, y: ay, w: aw, h: ah, cx: ax + aw / 2, cy: ay + ah / 2,
                       ep: {x: ax + aw - 4, y: ay + ah - 4}, cluster: c.id};
    });
  });
  out.principal = {x: W / 2 - 150, y: 18, w: 300, h: 46, cx: W / 2, cy: 41};
  out.ext = {x: 20, y: 520, w: 590, h: 100, cx: 315, cy: 570};
  out.oracle = {x: 640, y: 520, w: 340, h: 100, cx: 810, cy: 570};
  return out;
}

// ---------------------------------------------------------------- replay state
function freshState() {
  const st = {agents: {}, clusters: {}, held: {}, counts: {rel: 0, held: 0, rej: 0, exec: 0, toolHeld: 0,
    blocked: 0, oracle: 0, aborted: 0}, ext: [], oracle: {busy: null, last: null}, end: null, msgText: {}};
  for (const a of Object.keys(T.topology.agents))
    st.agents[a] = {status: "idle", tasks: 0, gate: null, flagged: false, last: "", thought: null};
  for (const c of T.topology.clusters) st.clusters[c.id] = {res: 0, aborted: 0, flash: null};
  return st;
}

function apply(st, e) {
  const A = e.agent && st.agents[e.agent];
  switch (e.kind) {
    case "agent.task": if (A) { A.status = "working"; A.tasks++; A.last = "task: " + short(e.text, 40); } break;
    case "agent.done": if (A) { A.status = "idle"; A.last = "answered"; } break;
    case "agent.llm": if (A) { A.thought = e.text || (e.tool_calls || []).map(c => "→ " + c.function).join(", ");
                              A.last = (e.tool_calls || []).length ? "calls " + e.tool_calls.map(c => c.function).join(", ") : "answers"; } break;
    case "agent.notice": if (A) A.last = "got a KAIROS notice"; break;
    case "gate": if (A) A.gate = e.decision; break;
    case "tool.result":
      if (e.status === "executed") { st.counts.exec++; st.ext.unshift({tool: e.tool, agent: e.agent, ok: !e.error}); }
      else if (e.status === "held") st.counts.toolHeld++;
      else if (e.status === "blocked") st.counts.blocked++;
      st.ext = st.ext.slice(0, 4);
      break;
    case "msg.send": st.msgText[e.kmid] = e.text; break;
    case "msg.outcome":
      if (e.outcome === "released" || e.outcome === "duplicate") st.counts.rel++;
      else if (e.outcome === "held") { st.counts.held++; (st.held[e.from] ||= []).push(e.kmid); }
      else if (e.outcome === "rejected") st.counts.rej++;
      break;
    case "msg.release": case "msg.drop":
      if (st.held[e.from]) st.held[e.from] = st.held[e.from].filter(k => k !== e.kmid);
      if (e.kind === "msg.drop") st.counts.rej++; else st.counts.rel++;
      break;
    case "oracle.request": st.oracle.busy = e.agent; st.counts.oracle++; break;
    case "oracle.verdict": st.oracle.busy = null; st.oracle.last = {agent: e.agent, ok: e.consistent, why: e.rationale}; break;
    case "resolution": {
      const c = st.clusters[e.cluster]; if (c) { c.res++; c.aborted += (e.aborted || []).length; }
      if ((e.aborted || []).length) { st.counts.aborted += e.aborted.length; if (A) A.flagged = true; }
      break; }
    case "run.end": st.end = e; break;
  }
}

function stateAt(n) { const st = freshState(); for (let i = 0; i < n; i++) apply(st, T.events[i]); return st; }

// ---------------------------------------------------------------- drawing
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent, text) {
  const x = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) x.setAttribute(k, v);
  if (text !== undefined) x.textContent = text;
  if (parent) parent.appendChild(x);
  return x;
}
function agentPoint(a, where = "center") {
  const g = L.agents[a];
  if (!g) return {x: L.principal.cx, y: L.principal.cy};
  if (where === "ep") return {x: g.ep.x, y: g.ep.y};
  return {x: g.cx, y: g.cy};
}
function boundaryPoint(a, b) {
  // where the line from agent a towards point b leaves a's cluster box
  const g = L.agents[a]; if (!g) return agentPoint(a);
  const c = L.clusters[g.cluster], p = {x: g.cx, y: g.cy};
  const dx = b.x - p.x, dy = b.y - p.y; let tmin = 1;
  for (const [edge, val, d, o] of [["x", c.x, dx, p.x], ["x", c.x + c.w, dx, p.x], ["y", c.y, dy, p.y], ["y", c.y + c.h, dy, p.y]]) {
    if (d === 0) continue; const t = (val - o) / d; if (t > 0 && t < tmin) tmin = t;
  }
  return {x: p.x + dx * tmin, y: p.y + dy * tmin};
}

function draw() {
  const svg = $("stage"); svg.innerHTML = "";
  if (!T) return;
  const st = S;
  // external boundary
  el("line", {x1: 10, y1: 490, x2: 990, y2: 490, stroke: css("--muted"), "stroke-dasharray": "6 5"}, svg);
  el("text", {x: 14, y: 485, class: "small"}, svg, "external boundary (tools · files · network)");
  // principal
  const P = L.principal;
  el("rect", {x: P.x, y: P.y, width: P.w, height: P.h, rx: 23, fill: css("--panel"), stroke: css("--blue")}, svg);
  el("text", {x: P.cx, y: P.cy - 2, "text-anchor": "middle", "font-weight": 600}, svg, "👤 Principal (user)");
  el("text", {x: P.cx, y: P.cy + 13, "text-anchor": "middle", class: "small"}, svg, short(T.prompt, 48));
  // clusters
  for (const [cid, c] of Object.entries(L.clusters)) {
    el("rect", {x: c.x, y: c.y, width: c.w, height: c.h, rx: 12, class: "cl-box"}, svg);
    el("text", {x: c.x + 12, y: c.y + 22, "font-weight": 600}, svg, "cluster " + cid);
    if (c.c.clearance) el("text", {x: c.x + 12, y: c.y + 36, class: "small"}, svg, "clearance: " + c.c.clearance);
    const cs = st.clusters[cid];
    const dpc = cs.flash ? cs.flash : (T.defense === false ? css("--muted") : css("--oracle"));
    el("rect", {x: c.dp.x - 26, y: c.dp.y - 10, width: 52, height: 22, rx: 6, fill: css("--panel"), stroke: dpc, "stroke-width": cs.flash ? 3 : 1.5}, svg);
    el("text", {x: c.dp.x, y: c.dp.y + 5, "text-anchor": "middle", "font-size": 11, "font-weight": 600}, svg,
       T.defense === false ? "no DP" : "DP " + (cs.res ? cs.res : ""));
    if (cs.aborted) el("text", {x: c.dp.x, y: c.dp.y + 26, "text-anchor": "middle", "font-size": 10, fill: css("--red")}, svg, cs.aborted + " withheld");
  }
  // agents
  for (const [a, g] of Object.entries(L.agents)) {
    const A = st.agents[a];
    const cls = "ag-box" + (A.status === "working" ? " working" : "") + (A.flagged ? " flagged" : "");
    el("rect", {x: g.x, y: g.y, width: g.w, height: g.h, rx: 9, class: cls}, svg);
    el("text", {x: g.x + 10, y: g.y + 18, "font-weight": 600}, svg, (a === T.topology.entry ? "★ " : "") + a);
    const tools = (T.topology.agents[a].tools || []);
    el("text", {x: g.x + 10, y: g.y + 33, class: "small"}, svg, short(tools.length ? tools.join(", ") : "no tools", 38));
    if (g.h > 52) el("text", {x: g.x + 10, y: g.y + 48, "font-size": 11, fill: css("--blue")}, svg, short(A.last, 36));
    // enforcement point badge
    const gc = A.gate ? DEC_COLOR[A.gate] : css("--muted");
    const ep = el("g", {}, svg);
    el("path", {d: `M${g.ep.x - 11} ${g.ep.y - 13} h22 v9 c0 8 -6 12 -11 14 c-5 -2 -11 -6 -11 -14 z`,
                fill: css("--panel"), stroke: T.defense === false ? css("--muted") : gc, "stroke-width": 2}, ep);
    el("text", {x: g.ep.x, y: g.ep.y + 1, "text-anchor": "middle", "font-size": 8, "font-weight": 700}, ep, "EP");
    const held = (st.held[a] || []).length;
    if (held) {
      el("rect", {x: g.x + g.w - 64, y: g.y + 4, width: 40, height: 16, rx: 8, fill: css("--amber")}, svg);
      el("text", {x: g.x + g.w - 44, y: g.y + 16, "text-anchor": "middle", "font-size": 10, fill: "#fff"}, svg, "✉ " + held + " held");
    }
  }
  // external world
  const E = L.ext;
  el("rect", {x: E.x, y: E.y, width: E.w, height: E.h, rx: 10, fill: css("--ext"), stroke: css("--cluster-line")}, svg);
  el("text", {x: E.x + 12, y: E.y + 20, "font-weight": 600}, svg, "🌐 External world");
  el("text", {x: E.x + 12, y: E.y + 36, class: "small"}, svg,
     `effects executed ${st.counts.exec} · held ${st.counts.toolHeld} · blocked ${st.counts.blocked}`);
  st.ext.slice(0, 3).forEach((x, i) => el("text", {x: E.x + 14, y: E.y + 54 + i * 15, "font-size": 11, fill: x.ok ? css("--ink") : css("--red")}, svg,
                               `${x.ok ? "✓" : "✗"} ${x.tool}  ← ${x.agent}`));
  // oracle
  const O = L.oracle;
  el("rect", {x: O.x, y: O.y, width: O.w, height: O.h, rx: 10, fill: css("--panel"), stroke: css("--oracle"),
              "stroke-width": st.oracle.busy ? 3 : 1.5}, svg);
  el("text", {x: O.x + 12, y: O.y + 20, "font-weight": 600, fill: css("--oracle")}, svg, "⚖ Oracle " + oracleName());
  el("text", {x: O.x + 12, y: O.y + 38, class: "small"}, svg, `consulted ${st.counts.oracle}×`);
  if (st.oracle.busy) el("text", {x: O.x + 12, y: O.y + 56, "font-size": 12, fill: css("--amber")}, svg, "reviewing an effect of " + st.oracle.busy + " …");

      break;

    case "tool.call": tok(ag(e.agent), ep(e.agent), css("--muted"), e.tool); break;
    case "tool.result":
      if (e.status === "executed") { tok(ep(e.agent), E, e.error ? css("--red") : css("--green"), e.tool); }
      else if (e.status === "held") tok(ep(e.agent), {x: ep(e.agent).x, y: 490}, css("--amber"), "held: " + e.tool, {stop: true});
      else if (e.status === "blocked") tok(ep(e.agent), {x: ep(e.agent).x, y: 490}, css("--red"), "blocked: " + e.tool, {stop: true, x: true});
      break;
    case "inbound.external": tok(E, ag(e.agent), css("--red"), "external content"); break;
    case "msg.send": tok(ag(e.from), ep(e.from), e.reply ? css("--purple") : css("--blue"), "✉ " + (e.reply ? "reply" : "request")); break;
    case "msg.outcome": {
      const color = e.outcome === "rejected" ? css("--red") : e.outcome === "held" ? css("--amber") : (S.msgText && false) || css("--blue");
      if (e.outcome === "released" || e.outcome === "duplicate") tok(ep(e.from), ag(e.to), css("--blue"), "✉ " + e.kmid);
      else tok(ep(e.from), boundaryPoint(e.from, ag(e.to)), color, (e.outcome === "held" ? "held " : "✗ rejected ") + e.kmid, {stop: true, x: e.outcome === "rejected"});

function visibleNext(from) { for (let i = from; i < T.events.length; i++) if (!hidden.has(CAT_OF[T.events[i].kind])) return i; return T.events.length - 1; }

  else if (animateIt && n > idx) { for (let i = idx; i < n; i++) apply(S, T.events[i]); idx = n; anims = []; spawnAnims(T.events[n - 1]); }

  if (cur && cur.kind === "resolution" && S.clusters[cur.cluster]) S.clusters[cur.cluster].flash = (cur.aborted || []).length ? css("--red") : css("--green");

function summary(e) {

    case "agent.done": return a + "answers: " + esc(short(e.text, 70));
    case "agent.llm": return a + ((e.tool_calls || []).length ? "→ " + esc(e.tool_calls.map(c => c.function).join(", ")) + " " : "") + esc(short(e.text, 60));

    case "msg.outcome": return `${esc(e.kmid)} ${tag(e.outcome)} <span class="muted">${esc(e.by || "")}</span> ` + esc(short(e.reason, 50));
    case "msg.deliver": return `${esc(e.kmid)} delivered to <b>${esc(e.to)}</b>`;
    case "msg.release": return `${esc(e.kmid)} ${tag("released")} after review`;
    case "msg.drop": return `${esc(e.kmid)} ${tag("dropped")} ` + esc(short(e.reason, 60));
    case "oracle.request": return `oracle asked about ${esc(e.agent)}: ` + esc((e.pending || []).map(p => p.tool).join(", "));
    case "oracle.llm": return "oracle model: " + esc(short(e.raw, 70));

  CURRENT = path; renderRuns();
  history.replaceState(null, "", "?run=" + encodeURIComponent(path));
  const r = await fetch("api/trace?path=" + encodeURIComponent(path));
  if (!r.ok) { alert("could not load " + path + ": " + (await r.text())); return; }
  load(await r.json());
}

// ---------------------------------------------------------------- wiring
$("btnPlay").onclick = () => playing ? pause() : play();
$("btnFwd").onclick = () => { pause(); stepForward(); };
$("btnBack").onclick = () => { pause(); stepBack(); };
$("btnReset").onclick = () => { pause(); goTo(0, false); };
$("btnEnd").onclick = () => { pause(); goTo(T.events.length, false); };
$("scrub").oninput = ev => { pause(); goTo(+ev.target.value, false); };
$("speed").onchange = () => { if (playing) schedule(); };
$("timing").onchange = () => { if (playing) schedule(); };
$("runfilter").oninput = renderRuns;
$("btnBrowser").onclick = () => {
  const on = $("browser").classList.toggle("on");
  document.documentElement.style.setProperty("--browser-w", on ? "300px" : "0px");
};
$("btnTheme").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark"; draw();
};
document.addEventListener("keydown", ev => {
  if (!T || ev.target.tagName === "INPUT") return;
  if (ev.key === " ") { ev.preventDefault(); playing ? pause() : play(); }
  else if (ev.key === "ArrowRight") { pause(); stepForward(); }
  else if (ev.key === "ArrowLeft") { pause(); stepBack(); }
  else if (ev.key === "Home") { pause(); goTo(0, false); }
  else if (ev.key === "End") { pause(); goTo(T.events.length, false); }
});
function readFile(f) {
  f.text().then(txt => {
    const d = JSON.parse(txt);
    const trace = d.events && d.topology ? d : d.trace;
    if (!trace) { alert("This result has no recorded trace. Reconstruct it with:\n  python -m kairos.mas.viewer export " + f.name + "\nor browse it with:  python -m kairos.mas.viewer serve <logdir>"); return; }
    trace.result ||= {utility: d.utility, attack_success: d.attack_success, output: d.output};
    load(trace);
  }).catch(err => alert("not a result or trace JSON: " + err));
}
$("file").onchange = ev => ev.target.files[0] && readFile(ev.target.files[0]);
const wrapEl = $("stagewrap");
wrapEl.addEventListener("dragover", ev => { ev.preventDefault(); $("drop").style.display = "flex"; });
wrapEl.addEventListener("dragleave", () => $("drop").style.display = "none");
wrapEl.addEventListener("drop", ev => { ev.preventDefault(); $("drop").style.display = "none"; if (ev.dataTransfer.files[0]) readFile(ev.dataTransfer.files[0]); });

(async () => {
  const embedded = JSON.parse($("trace-data").textContent);
  if (embedded) { load(embedded); return; }
  await initBrowser();
})();
</script>
</body>
</html>
