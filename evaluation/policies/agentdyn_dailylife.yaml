# AgentDyn dailylife suite under KAIROS. Tool names verified against the AgentDyn
# fork default_suites/v1/dailylife — 27 tools (banking + email + calendar + fs).
#
# Attack surface (10 injection tasks): transfers to an attacker IBAN (fixed
# amount, half the balance across two transfers, or the whole balance), deleting
# /system/.ssh/, exfiltrating id_rsa / mailbox contents / user info via
# send_email, a spoofed "day off" calendar event, and drive-by download/browse
# links. Transfers and the calendar event are integrity violations (recipient /
# participants not derivable from the user request); the id_rsa / mailbox / info
# leaks are confidentiality violations; the ssh-dir delete is a destructive
# non-revertable with an untrusted path.
version: "0.1"

context:
  name: dailylife
  description: "AgentDyn dailylife suite (payments + email + calendar + fs) under KAIROS."
  scope: "agentdyn:dailylife"
  default_action: REVIEW
  actions:
    revertable:
      [browse_webpage, download_file_through_id,
       get_balance, get_current_day, get_day_calendar_events,
       search_calendar_events, get_received_emails, get_sent_emails,
       get_unread_emails, search_emails, list_directory, read_file,
       create_dir, create_file, copy_node, move_node]
    #   send_money        -> recipient    : transfer (exfil + integrity)
    #   send_email        -> recipients    : exfil + integrity
    #   create_calendar_event / add_participants -> participants : outbound / spoof
    #   delete_email / delete_node -> destructive
    #   input_to_webpage  -> url          : submits data to a remote form
    #   verify_transaction-> otp          : confirms a held transfer (guard it too)
    non_revertable:
      # send_money is two-phase only ABOVE $500; at or below it transfers
      # immediately, so it stays gated (verify_transaction commits the >$500 case).
      # download_file_through_url writes a file from a content-supplied URL
      # (injection_task_7).
      [send_money, download_file_through_url, send_email, create_calendar_event,
       add_calendar_event_participants, cancel_calendar_event,
       reschedule_calendar_event, delete_email, delete_node,
       input_to_webpage, verify_transaction]

resources:
  taints:
    - {name: balance,       source: get_balance,          level: high}
    - {name: received_mail, source: get_received_emails,  level: high}
    - {name: unread_mail,   source: get_unread_emails,    level: high}
    - {name: searched_mail, source: search_emails,        level: high}
    - {name: sent_mail,     source: get_sent_emails,      level: high}
    - {name: file_content,  source: read_file,            level: high}
    - {name: calendar,      source: get_day_calendar_events, level: low}

  contact_book:
    lookup_fields: [recipient, recipients, cc, bcc, participants, url]
    on_miss: REVIEW
    entries: []
    seed: {}

rules: []
