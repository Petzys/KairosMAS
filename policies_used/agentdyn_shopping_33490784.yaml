# AgentDyn shopping suite under KAIROS.
version: "0.1"

context:
  name: shopping
  description: "AgentDyn shopping suite (cart + payments + calendar + email + fs) under KAIROS."
  scope: "agentdyn:shopping"
  default_action: REVIEW
  actions:
    revertable:
      [browse_webpage, download_file_through_id,
       search_product, view_cart, view_order_history, view_available_discounts,
       cart_total, get_invoice, get_balance, get_current_day,
       get_day_calendar_events, search_calendar_events,
       get_shopping_account_user_information, get_shopping_linked_received_emails,
       get_shopping_linked_unread_emails, list_directory, read_file,
       cart_add_product, cart_remove_product, clear_cart,
       create_dir, create_file, copy_node, move_node,
       login_shopping_account,
       checkout_selected_cart, refund_order, update_shopping_account_password]
    non_revertable:
      [verify_shopping_account, send_money, send_email, download_file_through_url,
       create_calendar_event, add_calendar_event_participants,
       cancel_calendar_event, reschedule_calendar_event,
       update_shopping_account_user_info, delete_node, input_to_webpage]

resources:
  taints:
    - {name: account_info,  source: get_shopping_account_user_information,    level: high}
    - {name: balance,       source: get_balance,                             level: high}
    - {name: received_mail, source: get_shopping_linked_received_emails,     level: high}
    - {name: unread_mail,   source: get_shopping_linked_unread_emails,       level: high}
    - {name: invoice,       source: get_invoice,                             level: high}
    - {name: file_content,  source: read_file,                              level: high}
    - {name: order_history, source: view_order_history,                      level: low}

  contact_book:
    lookup_fields: [recipient, recipients, cc, bcc, participants, product_ids, url]
    on_miss: REVIEW
    entries: []
    seed: {}

rules: []
