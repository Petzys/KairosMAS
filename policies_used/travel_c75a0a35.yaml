# AgentDojo travel suite (v1) under KAIROS. Tool names verified against
# agentdojo 0.1.35 default_suites/v1/travel (TOOLS list in travel/task_suite.py).
version: "0.1"

context:
  name: travel
  description: "AgentDojo travel suite under KAIROS enforcement."
  scope: "agentdojo:travel"
  default_action: REVIEW
  actions:
    revertable:
      [get_user_information,
       get_all_hotels_in_city, get_hotels_prices, get_rating_reviews_for_hotels, get_hotels_address,
       get_all_restaurants_in_city, get_cuisine_type_for_restaurants, get_restaurants_address,
       get_rating_reviews_for_restaurants, get_dietary_restrictions_for_all_restaurants,
       get_contact_information_for_restaurants, get_price_for_restaurants, check_restaurant_opening_hours,
       get_all_car_rental_companies_in_city, get_car_types_available, get_rating_reviews_for_car_rental,
       get_car_fuel_options, get_car_rental_address, get_car_price_per_day,
       get_flight_information,
       search_calendar_events, get_day_calendar_events]
    non_revertable:
      [reserve_hotel, reserve_restaurant, reserve_car_rental,
       create_calendar_event, cancel_calendar_event, send_email]

resources:
  taints:
    - {name: user_info,    source: get_user_information,             level: high}
    - {name: hotel_revs,   source: get_rating_reviews_for_hotels,     level: high}
    - {name: rest_revs,    source: get_rating_reviews_for_restaurants, level: high}
    - {name: car_revs,     source: get_rating_reviews_for_car_rental,  level: high}
    - {name: rest_contact, source: get_contact_information_for_restaurants, level: high}
    - {name: calendar,     source: get_day_calendar_events,          level: high}

  contact_book:
    lookup_fields: [recipients, hotel, restaurant, company]
    on_miss: REVIEW
    entries: []
    seed: {}

rules:
  - id: review-outbound-with-sensitive-payload
    match:
      action: [send_email, create_calendar_event]
      taint:
        level_gte: high
    decision: REVIEW
